name: Weekly Challenge Generator

on:
  schedule:
    # Every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Generate challenges for all missing weeks since the last one'
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'Preview the challenge without writing to file'
        required: false
        type: boolean
        default: false
      category:
        description: 'Force a category (leave empty for auto)'
        required: false
        type: choice
        options:
          - auto
          - friend
          - couple
          - both

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generate challenge
        run: |
          ARGS=()
          if [ "$BACKFILL" = "true" ]; then
            ARGS+=(--backfill)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$CATEGORY" ] && [ "$CATEGORY" != "auto" ]; then
            ARGS+=(--category "$CATEGORY")
          fi
          echo "Running: node scripts/generate-challenge.mjs ${ARGS[*]}"
          node scripts/generate-challenge.mjs "${ARGS[@]}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
          CATEGORY: ${{ github.event.inputs.category }}

      # The generator already retries drafts that break writing-style.md and keeps
      # the last one if it still fails, so this reports rather than blocks: a
      # flagged run is better than a week with no challenge.
      - name: Check copy style
        if: ${{ github.event.inputs.dry-run != 'true' }}
        continue-on-error: true
        run: npm run lint:copy

      - name: Commit & push
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: |
          git config user.name "Challenge Bot"
          git config user.email "bot@friend-challenges.app"
          git add src/data/challenges.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔥 New weekly challenge [$(date -u +%Y-%m-%d)]"
            git push
          fi
